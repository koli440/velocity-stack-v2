name: Bot riders daily run

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      reset:
        description: 'Reset bot data and backfill history first'
        type: boolean
        default: false
      backfill_days:
        description: 'Days of history when resetting'
        default: '60'

concurrency: bots

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Reset and backfill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset }}
        run: node scripts/bots/reset.mjs --backfill-days ${{ inputs.backfill_days }}
      - name: Daily rides
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reset) }}
        run: node scripts/bots/daily.mjs
